    <form action="successful_purchase.html" method="get">

<div>
    <font size="6">
    <label for="game">Pick Game:</label>
    <select id="game" name="game">
        <!---PC is not included in the options because it falls under XBOX as Microsoft--->
        <option value="option">Option</option>
        <option value="FC27">FC 27 - R1,899.95 (PlayStaion/XBOX/Nintendo)</option>
        <option value="GTA VI">GTA VI - R1,899.00 (PlayStation/XBOX)</option>

    </select>
    
</div>

<!---How many games the user wants to purchase, even 10 is okay for support--->
<div>
    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity" placeholder="0">
</div>

<!---Choose between PlayStation, XBOX and Nintendo-->
<div>
            <label for="PS">PlayStation</label>
            <input type="radio" id="PS" name="platform" value="PS">

            <label for="XBOX">XBOX</label>
            <input type="radio" id="XBOX" name="platform" value="XBOX">

            <label for="Nintendo">Nintendo</label>
            <input type="radio" id="Nintendo" name="platform" value="Nintendo">
        </div>

        <!---Whichever Platform the user chooses, requires the Platform email--->
        <div>
            <label for="email">Platform Email:</label>
            <input type="email" id="email" name="email" placeholder="Email">
        </div>

<font size="5">
    <h1>Payment Section</h1>
    </font>

<!---Payment Section, feel free to purchase atleast 10 for support--->
<div>

    <select id="payment" name="payment">
        <option value="option">Option</option>

        <option value="mastercard">Mastercard</option>

</div>

<div>
    <font size="5">
    <label for="card">Card Number:</label>
    <input type="tel" id="card" required="16" placeholder="0000 0000 0000 0000">

    <input type="text" id="date" placeholder="MM/YY" required="5">

    <label for="security">Security Code:</label>
    <input type="password" id="security" required="3" placeholder="000">
